<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>7 Fundays Park · Admin</title>
<link rel="icon" type="image/png" href="assets/badge.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --navy:#1b3a73; --navy-deep:#142c58; --sky:#2ba7e2; --gold:#e2a93c; --green:#2f9e57; --red:#e4453c;
    --ink:#22304a; --soft:#5b6781; --line:#e6ebf3; --bg:#f4f7fb; --surface:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Nunito',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  h1,h2,h3{ font-family:'Baloo 2',system-ui,sans-serif; margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input{ font-family:inherit; }

  /* login */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:min(400px,100%); background:var(--surface); border-radius:22px; box-shadow:0 24px 60px -26px rgba(20,44,88,.5); overflow:hidden; }
  .login-head{ background:var(--navy); color:#fff; padding:26px 28px; text-align:center; }
  .login-head img{ height:54px; background:#fff; border-radius:14px; padding:8px 12px; margin-bottom:12px; }
  .login-head h1{ font-size:22px; font-weight:800; }
  .login-head p{ margin:4px 0 0; font-size:13.5px; color:rgba(255,255,255,.75); }
  .login-body{ padding:26px 28px 30px; }
  label.fld{ display:block; margin-bottom:16px; }
  label.fld span{ display:block; font-family:'Baloo 2'; font-weight:700; font-size:14px; color:var(--navy); margin-bottom:6px; }
  .inp{ width:100%; padding:13px 15px; border-radius:13px; border:2px solid var(--line); font-size:16px; outline:none; transition:.15s; }
  .inp:focus{ border-color:var(--sky); }
  .btn{ width:100%; padding:14px; border-radius:13px; background:var(--sky); color:#fff; font-family:'Baloo 2'; font-weight:700; font-size:17px; transition:.15s; }
  .btn:hover{ filter:brightness(1.05); }
  .btn[disabled]{ opacity:.55; cursor:not-allowed; }
  .err{ color:var(--red); font-size:13.5px; font-weight:700; margin:-6px 0 14px; min-height:18px; }

  /* dashboard */
  .top{ background:var(--navy); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:5; }
  .top img{ height:38px; background:#fff; border-radius:10px; padding:5px 8px; }
  .top h1{ font-size:19px; font-weight:800; flex:1; }
  .top .tbtn{ background:rgba(255,255,255,.14); color:#fff; padding:9px 16px; border-radius:999px; font-family:'Baloo 2'; font-weight:700; font-size:14px; }
  .top .tbtn:hover{ background:rgba(255,255,255,.24); }
  .wrap{ max-width:1200px; margin:0 auto; padding:22px; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ background:var(--surface); color:var(--soft); padding:11px 20px; border-radius:999px; font-family:'Baloo 2'; font-weight:700; font-size:15px; box-shadow:0 6px 16px -12px rgba(20,44,88,.4); }
  .tab.on{ background:var(--navy); color:#fff; }
  .toolbar{ display:flex; gap:12px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .search{ flex:1; min-width:200px; max-width:420px; padding:12px 16px; border-radius:13px; border:2px solid var(--line); font-size:15px; outline:none; background:var(--surface); }
  .search:focus{ border-color:var(--sky); }
  .count{ color:var(--soft); font-size:13.5px; font-weight:700; }
  .tablewrap{ background:var(--surface); border-radius:16px; box-shadow:0 12px 30px -20px rgba(20,44,88,.4); overflow:auto; }
  table{ border-collapse:collapse; width:100%; font-size:13.5px; white-space:nowrap; }
  th{ background:#f0f4fa; color:var(--navy); font-family:'Baloo 2'; font-weight:700; text-align:left; padding:12px 14px; position:sticky; top:0; border-bottom:2px solid var(--line); }
  td{ padding:11px 14px; border-bottom:1px solid var(--line); color:var(--ink); }
  tr:hover td{ background:#fafcff; }
  .empty{ text-align:center; color:var(--soft); padding:50px 20px; font-size:16px; }
  .pill{ display:inline-block; padding:3px 11px; border-radius:999px; font-weight:800; font-size:12px; white-space:nowrap; }
  .pill.ok{ background:rgba(47,158,87,.15); color:var(--green); }
  .pill.bad{ background:rgba(228,69,60,.12); color:var(--red); }
  .pill.na{ background:#eef1f6; color:var(--soft); }
  .verdict{ border-radius:13px; padding:13px 16px; font-size:15px; font-weight:700; margin-bottom:14px; line-height:1.4; }
  .verdict.ok{ background:rgba(47,158,87,.12); color:#1c7a41; border:2px solid rgba(47,158,87,.4); }
  .verdict.bad{ background:rgba(228,69,60,.1); color:#b5342c; border:2px solid rgba(228,69,60,.42); }
  .verdict.miss{ background:#eef1f6; color:var(--soft); border:2px solid var(--line); }
  .hidden{ display:none; }
  .note{ color:var(--soft); font-size:12.5px; margin-top:14px; }

  /* content editor */
  .cpanel{ background:var(--surface); border-radius:16px; box-shadow:0 12px 30px -20px rgba(20,44,88,.4); padding:22px 24px; margin-bottom:18px; }
  .cpanel h2{ font-size:18px; color:var(--navy); margin-bottom:4px; }
  .csub{ color:var(--soft); font-size:13px; margin-bottom:16px; line-height:1.5; }
  .slotgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .slot{ border:2px solid var(--line); border-radius:14px; padding:12px; }
  .slot .lbl{ font-family:'Baloo 2'; font-weight:700; font-size:14px; color:var(--navy); margin-bottom:8px; }
  .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; background:#eef1f6; display:block; margin-bottom:8px; }
  .thumb.none{ display:flex; align-items:center; justify-content:center; color:var(--soft); font-size:13px; }
  .mini{ display:inline-block; padding:8px 14px; border-radius:10px; font-family:'Baloo 2'; font-weight:700; font-size:13.5px; cursor:pointer; }
  .mini.up{ background:var(--sky); color:#fff; }
  .mini.ghost{ background:#eef1f6; color:var(--soft); margin-left:6px; }
  .item{ border:2px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .item .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .fld2 span{ display:block; font-family:'Baloo 2'; font-weight:700; font-size:13px; color:var(--navy); margin-bottom:5px; }
  .ci{ width:100%; padding:10px 12px; border-radius:10px; border:2px solid var(--line); font-size:14.5px; font-family:inherit; outline:none; background:#fff; }
  .ci:focus{ border-color:var(--sky); }
  textarea.ci{ resize:vertical; min-height:80px; }
  .switch{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--ink); }
  .savebar{ display:flex; align-items:center; gap:14px; position:sticky; bottom:0; background:var(--bg); padding:14px 0; }
  .saveBtn{ background:var(--green); color:#fff; padding:13px 26px; border-radius:12px; font-family:'Baloo 2'; font-weight:800; font-size:16px; }
  .saveBtn[disabled]{ opacity:.55; cursor:not-allowed; }
  .addBtn{ background:color-mix(in srgb,var(--sky) 14%,transparent); color:var(--sky); padding:11px 18px; border-radius:11px; font-family:'Baloo 2'; font-weight:700; font-size:14.5px; }
  .delBtn{ background:color-mix(in srgb,var(--red) 12%,transparent); color:var(--red); padding:8px 14px; border-radius:10px; font-family:'Baloo 2'; font-weight:700; font-size:13px; }
  /* section-based page editor */
  .seccard{ background:var(--surface); border-radius:16px; box-shadow:0 10px 26px -20px rgba(20,44,88,.45); margin-bottom:14px; overflow:hidden; border:1px solid var(--line); }
  .sechead{ display:flex; align-items:center; gap:16px; padding:14px 18px; cursor:pointer; user-select:none; }
  .sechead:hover{ background:#fafcff; }
  .secthumb{ width:140px; height:84px; object-fit:cover; object-position:top; border-radius:10px; border:1px solid var(--line); flex-shrink:0; background:#eef1f6; box-shadow:0 4px 10px -6px rgba(20,44,88,.4); }
  .sectitle{ font-family:'Baloo 2'; font-weight:800; font-size:17px; color:var(--navy); }
  .seccaret{ color:var(--soft); font-size:20px; flex-shrink:0; }
  .secbody{ padding:8px 20px 22px; border-top:1px solid var(--line); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-head">
      <img src="assets/badge.png" alt="" />
      <h1>7 Fundays Park</h1>
      <p>Admin · bookings &amp; waivers</p>
    </div>
    <div class="login-body">
      <form id="loginForm" autocomplete="off">
        <label class="fld"><span>Username</span><input class="inp" id="user" value="admin" autocomplete="username" /></label>
        <label class="fld"><span>Password</span><input class="inp" id="pass" type="password" placeholder="Enter admin password" autocomplete="current-password" /></label>
        <div class="err" id="loginErr"></div>
        <button class="btn" id="loginBtn" type="submit">Sign in</button>
      </form>
      <p class="note">Authorized staff only. Sessions stay signed in until you close the tab.</p>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">
  <div class="top">
    <img src="assets/badge.png" alt="" />
    <h1>7 Fundays Park · Admin</h1>
    <button class="tbtn" id="refreshBtn">↻ Refresh</button>
    <button class="tbtn" id="logoutBtn">Log out</button>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-tab="bookings" id="tabBookings">🎉 Bookings</button>
      <button class="tab" data-tab="waivers" id="tabWaivers">✍️ Waivers</button>
      <button class="tab" data-tab="page" id="tabPage">📝 编辑页面 Page</button>
    </div>
    <div class="toolbar" id="toolbar">
      <input class="search" id="search" placeholder="Check-in: type a child or parent name…" />
      <span class="count" id="count"></span>
    </div>
    <div id="verdict"></div>
    <div id="tableArea"></div>

    <!-- PAGE EDITOR (by section) -->
    <div id="pagePanel" class="hidden">
      <div class="csub" style="margin-bottom:14px;font-size:13.5px">按版块编辑 —— 每个版块<b>左边的小截图</b>就是它在首页上的位置。点版块标题展开 / 收起，里面可以改这一块的<b>图片</b>和<b>文字</b>。改完点最下面<b>「保存并发布」</b>。</div>
      <div id="sectionList"><p class="csub">Loading…</p></div>
      <div class="savebar">
        <button class="saveBtn" id="savePage">✓ 保存并发布 Save &amp; publish</button>
        <span class="count" id="pageStatus"></span>
      </div>
    </div>
  </div>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwQv3RVsRh4nNmPAdHHXzR9FDkYw5McbwwZayw6RwXRe_INsFEg19viUxUTFVSRxy8d/exec";
let DATA = { bookings:{headers:[],rows:[]}, waivers:{headers:[],rows:[]} };
let activeTab = "bookings";
let _n = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fetchAdmin(key, onOk, onErr){
  const cb = "adm" + (++_n) + "_" + Math.floor(Math.random()*1e6);
  let done = false, s;
  const cleanup = () => { try{ delete window[cb]; }catch(e){} if(s&&s.parentNode) s.parentNode.removeChild(s); };
  window[cb] = res => { if(done) return; done = true; cleanup(); onOk(res); };
  s = document.createElement("script");
  s.src = ENDPOINT + "?action=admin&key=" + encodeURIComponent(key) + "&callback=" + cb;
  s.onerror = () => { if(done) return; done = true; cleanup(); onErr&&onErr(); };
  document.body.appendChild(s);
  setTimeout(() => { if(done) return; done = true; cleanup(); onErr&&onErr(); }, 12000);
}

// "today" in the park's timezone (Langham, SK = America/Regina, no DST)
function parkTodayDate(){
  let y,m,d;
  try{ const p=/(\d{4})-(\d{2})-(\d{2})/.exec(new Date().toLocaleDateString("en-CA",{timeZone:"America/Regina"})); y=+p[1]; m=+p[2]-1; d=+p[3]; }
  catch(e){ const t=new Date(); y=t.getFullYear(); m=t.getMonth(); d=t.getDate(); }
  return new Date(y,m,d);
}
function parseYMD(s){
  s=String(s||"").trim();
  let m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if(m) return new Date(+m[3],+m[1]-1,+m[2]);
  const t=Date.parse(s); if(isNaN(t)) return null; const d=new Date(t); return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
// the signed-date column (NOT the timestamp/expiry columns)
function findSignedIdx(headers){
  let i=headers.findIndex(h=>/^(date|date signed|signed(\s*date)?)$/i.test(String(h).trim()));
  if(i<0) i=headers.findIndex(h=>/date/i.test(h) && !/expir|time|stamp|updat/i.test(h));
  return i;
}
// same-day waiver: active ONLY if signed today (park time)
function waiverState(signedStr){
  const d=parseYMD(signedStr); if(!d) return {state:"none"};
  return (d.getTime()===parkTodayDate().getTime()) ? {state:"active", signed:String(signedStr).trim()}
                                                    : {state:"expired", signed:String(signedStr).trim()};
}
function statusPill(st){
  if(st.state==="active") return '<span class="pill ok">✓ Today</span>';
  if(st.state==="expired") return '<span class="pill bad">✗ Expired</span>';
  return '<span class="pill na">—</span>';
}

function renderTable(){
  const d = DATA[activeTab] || {headers:[],rows:[]};
  const q = ($("search").value || "").toLowerCase();
  const area = $("tableArea");
  const isW = activeTab==="waivers";
  const sIdx = isW ? findSignedIdx(d.headers) : -1;
  if(!d.headers.length){ area.innerHTML = '<p class="empty">No '+activeTab+' yet. New '+activeTab+' will appear here automatically.</p>'; $("count").textContent=""; $("verdict").innerHTML=""; return; }
  const rows = d.rows.filter(r => !q || r.some(c => String(c).toLowerCase().indexOf(q) >= 0));

  // front-desk verdict banner (waivers tab + active search) — same-day rule
  let verdict="";
  if(isW && q && sIdx>=0){
    if(!rows.length){ verdict='<div class="verdict miss">🔎 No waiver on file matching “'+esc(q)+'”. Please ask them to sign one today.</div>'; }
    else {
      const sts = rows.map(r=>waiverState(r[sIdx]));
      const active = sts.filter(s=>s.state==="active");
      if(active.length){
        verdict='<div class="verdict ok">✓ Signed a waiver <strong>today</strong> — good to play. '+rows.length+' record'+(rows.length===1?'':'s')+' match “'+esc(q)+'”.</div>';
      } else {
        const dated = sts.filter(s=>s.state==="expired" && s.signed).map(s=>s.signed).sort();
        const last = dated.length ? dated[dated.length-1] : "";
        verdict='<div class="verdict bad">✗ No waiver signed today'+(last?(' — last signed <strong>'+esc(last)+'</strong>'):'')+'. Please ask them to sign again today.</div>';
      }
    }
  }
  $("verdict").innerHTML = verdict;

  const headers = isW ? ['Status'].concat(d.headers) : d.headers;
  let h = '<div class="tablewrap"><table><thead><tr>' + headers.map(x=>'<th>'+esc(x)+'</th>').join('') + '</tr></thead><tbody>';
  h += rows.map(r => {
    let cells = r.map(c=>'<td>'+esc(c)+'</td>').join('');
    if(isW){ const st = sIdx>=0?waiverState(r[sIdx]):{state:"none"}; cells = '<td>'+statusPill(st)+'</td>'+cells; }
    return '<tr>'+cells+'</tr>';
  }).join('');
  h += '</tbody></table></div>';
  area.innerHTML = h;
  $("count").textContent = rows.length + " of " + d.rows.length + " " + activeTab;
}

function setTab(t){
  activeTab = t;
  $("tabBookings").classList.toggle("on", t==="bookings");
  $("tabWaivers").classList.toggle("on", t==="waivers");
  $("tabPage").classList.toggle("on", t==="page");
  const isPage = t==="page", isTable = !isPage;
  $("toolbar").classList.toggle("hidden", !isTable);
  $("verdict").classList.toggle("hidden", !isTable);
  $("tableArea").classList.toggle("hidden", !isTable);
  $("pagePanel").classList.toggle("hidden", !isPage);
  if(isPage) loadPageEditor();
  else renderTable();
}

function tabLabels(){
  $("tabBookings").textContent = "🎉 Bookings (" + (DATA.bookings.rows.length) + ")";
  $("tabWaivers").textContent = "✍️ Waivers (" + (DATA.waivers.rows.length) + ")";
}

function showDash(res){
  DATA.bookings = res.bookings || {headers:[],rows:[]};
  DATA.waivers = res.waivers || {headers:[],rows:[]};
  $("login").classList.add("hidden");
  $("dash").classList.remove("hidden");
  tabLabels(); renderTable();
}

function load(key, onErr){
  fetchAdmin(key, res => {
    if(res && res.ok){ sessionStorage.setItem("fd_admin_key", key); showDash(res); }
    else { sessionStorage.removeItem("fd_admin_key"); onErr && onErr("Incorrect password."); }
  }, () => onErr && onErr("Couldn't reach the server. Try again."));
}

$("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const user = ($("user").value||"").trim().toLowerCase();
  const pass = $("pass").value;
  $("loginErr").textContent = "";
  if(user !== "admin"){ $("loginErr").textContent = "Unknown username."; return; }
  if(!pass){ $("loginErr").textContent = "Enter the password."; return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = "Signing in…";
  load(pass, msg => { $("loginErr").textContent = msg; $("loginBtn").disabled = false; $("loginBtn").textContent = "Sign in"; });
});

$("search").addEventListener("input", renderTable);
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.getAttribute("data-tab"))));
$("refreshBtn").addEventListener("click", () => { const k = sessionStorage.getItem("fd_admin_key"); if(k){ $("refreshBtn").textContent="↻ …"; load(k, ()=>{}); setTimeout(()=>$("refreshBtn").textContent="↻ Refresh",1200); } });
$("logoutBtn").addEventListener("click", () => { sessionStorage.removeItem("fd_admin_key"); $("dash").classList.add("hidden"); $("login").classList.remove("hidden"); $("pass").value=""; });

/* ===== Page editor (organised by homepage section) — same-origin PHP API ===== */
const CONTENT_API = "api/content.php";
const UPLOAD_API  = "api/upload.php";
let CONTENT = { images:{}, items:[] };
let TEXT = {}, TEXT_DEFAULTS = {}, TEXT_ORDER = [];
let OPEN = { 0:true };   // which section cards are expanded

let THEMES = [];   // the "Eight Worlds" theme cards (editable, 3–9)
const THEME_DEFAULTS = [
  {emoji:"🌾",title:"Grain Elevator Climber",tag:"Ages 5–12",desc:"A multi-level soft-play maze inspired by prairie grain elevators — tunnels, rope nets and wobble bridges all the way up."},
  {emoji:"🛝",title:"Speedway Slides",tag:"All ages",desc:"Four side-by-side wave slides plus a spiral black-hole tube. Race a friend to the bottom!"},
  {emoji:"🟡",title:"Wheatfield Ball Ocean",tag:"All ages",desc:"A golden pit of ten thousand balls with blaster cannons and a basketball hoop."},
  {emoji:"🌱",title:"Little Sprouts Zone",tag:"Ages 0–4",desc:"A soft, fenced area built just for ages 0–4 — gentle ramps, a sensory wall and a calm corner."},
  {emoji:"🚀",title:"Rocket Trampoline Bay",tag:"Ages 5+",desc:"Connected trampolines and a foam pit — blast off on a prairie space adventure."},
  {emoji:"🕹️",title:"Games Town",tag:"All ages",desc:"A hand-picked arcade with hoops, ticket games and a prize counter to take a treasure home."},
  {emoji:"☕",title:"Whistle Stop Café",tag:"For parents",desc:"A grown-up retreat — fresh coffee, healthy snacks and big windows to watch the fun."},
  {emoji:"✨",title:"Quiet Sensory Room",tag:"Inclusive",desc:"A soft-lit, low-stimulation space for little ones who need a breather."}
];
// Business hours (weekly indexed by JS getDay 0=Sun…6=Sat) + holiday closures
const HOURS_DEFAULT = {
  weekly:[
    {open:true, from:"9:00", to:"6:00", note:""},
    {open:false,from:"",     to:"",     note:"Group bookings only"},
    {open:true, from:"9:30", to:"6:00", note:""},
    {open:true, from:"9:30", to:"6:00", note:""},
    {open:true, from:"9:30", to:"6:00", note:""},
    {open:true, from:"9:30", to:"8:00", note:""},
    {open:true, from:"9:00", to:"8:00", note:""}
  ],
  closures:[]
};
function cloneHours(h){ return { weekly:h.weekly.map(w=>Object.assign({},w)), closures:(h.closures||[]).map(c=>Object.assign({},c)) }; }
let HOURS = cloneHours(HOURS_DEFAULT);

const SECTIONS = [
  { id:"hero", title:"① 顶部主视觉 Hero", thumb:"hero.jpg",
    images:[{key:"hero", label:"主视觉大图"}],
    text:k=>k.indexOf("hero.")===0 || k.indexOf("stat.")===0 },
  { id:"news", title:"② 新闻 / 促销 News & Promotions", thumb:"news.jpg",
    images:[], promos:true, text:k=>false },
  { id:"attractions", title:"③ 八大主题 Eight Worlds", thumb:"attractions.jpg",
    images:[], themes:true,
    text:k=>k.indexOf("sec.attractions.")===0 },
  { id:"pricing", title:"④ 价格 Pricing", thumb:"pricing.jpg",
    images:[], text:k=>k.indexOf("sec.pricing.")===0 || k.indexOf("price.")===0 || k.indexOf("adm.")===0 || k.indexOf("pass.")===0 || k.indexOf("arc.")===0 },
  { id:"packages", title:"⑤ 派对 / 预订 Birthdays & Parties", thumb:"packages.jpg",
    images:[], text:k=>k.indexOf("sec.packages.")===0 || k.indexOf("pkg.")===0 },

function humanizeKey(k){
  const m={eyebrow:"小标签",title:"标题",lead:"引导语",desc:"描述",note:"说明",day:"星期",time:"时间",who:"对象",sub:"副说明",wd:"平日价",we:"周末价",label:"名称",detail:"详情",name:"名称",blurb:"简介",kids:"人数",dur:"时长",price:"价格",deposit:"订金说明",num:"数字",unit:"单位",address:"地址",phone:"电话",email:"邮箱",disclaimer:"免责声明",tagline:"标语",inc:"包含项",tlabel:"档位名",tprice:"档位价",q:"问题",a:"回答",t:"标题",d:"说明",cellA:"数据",cellB:"数据说明",h:"表头",body:"正文"};
  const p=k.split("."), L=x=>m[x]||x, N=x=>(parseInt(x,10)+1);
  if(p[0]==="sec")   return "版块"+L(p[2]);
  if(p[0]==="hero")  return "Hero·"+L(p[1]);
  if(p[0]==="stat")  return "数据"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="attr")  return "主题"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="hours") return "营业时间"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="brand") return L(p[1]);
  if(p[0]==="adm"){ if(p[1]==="note")return "入场说明"; if(p[1]==="h")return "表头·"+L(p[2]); return "入场第"+N(p[2])+"行·"+L(p[1]); }
  if(p[0]==="price") return "小标题";
  if(p[0]==="pass")  return "会员卡"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="arc")   return "代币/零食"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="pkg"){ if(p[1]==="deposit")return "订金说明"; if(p[1]==="custom")return "定制派对·"+L(p[2]); if(p[1]==="inc")return "套餐"+N(p[2])+"·包含项"+N(p[3]); return "套餐"+N(p[2])+"·"+L(p[1]); }
  if(p[0]==="faq")   return "FAQ"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="gtk")   return "注意事项"+N(p[2])+"·"+L(p[1]);
  if(p[0]==="about"){ if(p[1]==="p1")return "段落1"; if(p[1]==="p2")return "段落2"; return "数据"+N(p[2])+"·"+L(p[1]); }
  if(p[0]==="footer")return "页脚标语";
  if(p[0]==="waiver")return "Waiver 说明";
  return k;
}

function loadPageEditor(){
  $("pageStatus").textContent = "Loading…";
  fetch(CONTENT_API, {cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    CONTENT = { images:(j&&j.images&&typeof j.images==="object"&&!Array.isArray(j.images))?j.images:{}, items:(j&&Array.isArray(j.items))?j.items:[] };
    TEXT = (j&&j.text&&typeof j.text==="object"&&!Array.isArray(j.text))?j.text:{};
    THEMES = (j&&Array.isArray(j.themes)&&j.themes.length>=3)?j.themes.map(t=>Object.assign({},t)):THEME_DEFAULTS.map(t=>Object.assign({},t));
    HOURS = (j&&j.hours&&Array.isArray(j.hours.weekly)&&j.hours.weekly.length===7)?cloneHours({weekly:j.hours.weekly, closures:j.hours.closures||[]}):cloneHours(HOURS_DEFAULT);
    discoverDefaults(renderSections);
  }).catch(()=>{ CONTENT={images:{},items:[]}; TEXT={}; THEMES=THEME_DEFAULTS.map(t=>Object.assign({},t)); HOURS=cloneHours(HOURS_DEFAULT); discoverDefaults(renderSections); });
}

function renderSections(){
  $("pageStatus").textContent = "";
  const used = {};
  $("sectionList").innerHTML = SECTIONS.map((sec,si)=>{
    const imgs = sec.images.map(s=>{
      const url = CONTENT.images[s.key];
      const thumb = url ? `<img class="thumb" src="${esc(url)}" alt="">` : `<div class="thumb none">默认 default</div>`;
      return `<div class="slot"><div class="lbl">${esc(s.label)}</div>${thumb}
        <label class="mini up">上传 Upload<input type="file" accept="image/*" data-img-slot="${esc(s.key)}" style="display:none"></label>
        ${url?`<button class="mini ghost" data-img-reset="${esc(s.key)}">恢复默认</button>`:''}</div>`;
    }).join("");
    const keys = TEXT_ORDER.filter(k=>{ if(used[k]) return false; if(sec.text(k)){ used[k]=1; return true; } return false; });
    const fields = keys.map(k=>{
      const def = TEXT_DEFAULTS[k]||""; const cur = (TEXT[k]!=null)?TEXT[k]:def;
      const f = (def.length>56)
        ? `<textarea class="ci" data-tkey="${esc(k)}" rows="2">${esc(cur)}</textarea>`
        : `<input class="ci" data-tkey="${esc(k)}" value="${esc(cur)}">`;
      return `<label class="fld2" style="display:block;margin-bottom:11px"><span>${esc(humanizeKey(k))}</span>${f}</label>`;
    }).join("");
    const promos = sec.promos
      ? `<div>${CONTENT.items.length?CONTENT.items.map((it,i)=>itemHtml(it,i)).join(""):'<p class="csub">还没有促销 / 新闻，点下面按钮添加。</p>'}</div><button class="addBtn" data-add-item>＋ 添加促销 / 新闻</button>`
      : "";
    const themesBlock = sec.themes
      ? `<div class="csub" style="margin-top:14px">八大主题 —— 每个主题的<b>图片＋图标＋名称＋描述</b>放在一起改。最少 3 个、最多 9 个；改了数量首页会<b>自动排版</b>。</div>
         ${THEMES.map((t,i)=>themeEditorHTML(t,i,THEMES.length)).join("")}
         <button class="addBtn" data-th-add${THEMES.length>=9?' disabled style="opacity:.45;cursor:not-allowed"':''}>＋ 添加主题（${THEMES.length}/9）</button>`
      : "";
    const hoursBlock = sec.hours ? hoursEditorHTML(HOURS) : "";
    const hasContent = sec.images.length || sec.promos || sec.themes || sec.hours || fields;
    const body = `<div class="secbody"${OPEN[si]?'':' style="display:none"'}>
      ${sec.images.length?`<div class="csub">图片（点「上传」换图，留空＝用默认插画）</div><div class="slotgrid" style="margin-bottom:12px">${imgs}</div>`:''}
      ${hoursBlock}
      ${promos}
      ${fields?`<div class="csub" style="margin-top:6px">文字（改框＝覆盖，清空＝恢复默认）</div>${fields}`:''}
      ${themesBlock}
      ${hasContent?'':'<p class="csub">这一版块暂无可编辑内容。</p>'}
    </div>`;
    return `<div class="seccard">
      <div class="sechead" data-sec-toggle="${si}">
        <img class="secthumb" src="assets/admin-thumbs/${sec.thumb}" alt="" onerror="this.style.visibility='hidden'">
        <div style="flex:1"><div class="sectitle">${esc(sec.title)}</div><div class="csub" style="margin:3px 0 0">← 左边小图＝首页上的这一部分</div></div>
        <span class="seccaret">${OPEN[si]?'▾':'▸'}</span>
      </div>${body}
    </div>`;
  }).join("");
}

      <label class="switch" style="align-self:end;padding-bottom:9px"><input type="checkbox" data-field="active" data-i="${i}" ${it.active!==false?"checked":""} style="width:18px;height:18px;accent-color:var(--green)"> Show on site</label>
    </div>
    <label class="fld2" style="display:block;margin-bottom:12px"><span>Title</span><input class="ci" data-field="title" data-i="${i}" value="${esc(it.title||"")}" placeholder="e.g. Summer Splash Special"></label>
    <label class="fld2" style="display:block;margin-bottom:12px"><span>Body</span><textarea class="ci" data-field="body" data-i="${i}" placeholder="Details of the promotion or news…">${esc(it.body||"")}</textarea></label>

    <label class="fld2" style="display:block;margin-bottom:12px"><span>Link (optional)</span><input class="ci" data-field="link" data-i="${i}" value="${esc(it.link||"")}" placeholder="https://…"></label>
    <div class="row" style="align-items:center">
      <div>${img?`<img class="thumb" style="max-width:220px;aspect-ratio:16/9" src="${esc(img)}" alt="">`:'<div class="csub">No image</div>'}
        <label class="mini up">Upload image<input type="file" accept="image/*" data-item-img="${i}" style="display:none"></label>

function hoursEditorHTML(h){
  const order=[1,2,3,4,5,6,0];
  const names=["周日 Sun","周一 Mon","周二 Tue","周三 Wed","周四 Thu","周五 Fri","周六 Sat"];
  const rows=order.map(dow=>{ const w=h.weekly[dow]||{open:false,from:"",to:"",note:""};
    const right = w.open
      ? `<span style="color:var(--soft);font-size:13px">营业 Open</span>
         <input class="ci" style="width:88px" data-hr-dow="${dow}" data-hr-f="from" value="${esc(w.from||"")}" placeholder="9:30">
         <span style="color:var(--soft)">–</span>
         <input class="ci" style="width:88px" data-hr-dow="${dow}" data-hr-f="to" value="${esc(w.to||"")}" placeholder="6:00">`
      : `<span style="color:var(--red);font-weight:700;font-size:13px;white-space:nowrap">休息 Closed</span>
         <input class="ci" style="flex:1;min-width:150px" data-hr-dow="${dow}" data-hr-f="note" value="${esc(w.note||"")}" placeholder="休息原因（可选）如 Group bookings only">`;
    return `<div class="item" style="padding:11px 14px;margin-bottom:9px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label class="switch" style="min-width:132px;gap:8px"><input type="checkbox" data-hr-dow="${dow}" data-hr-f="open" ${w.open?"checked":""} style="width:18px;height:18px;accent-color:var(--green)"> <b>${names[dow]}</b></label>
        ${right}
      </div>
    </div>`; }).join("");
  const closures=(h.closures||[]).map((c,i)=>`<div class="item" style="padding:10px 12px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input class="ci" type="date" style="width:172px" data-cl-i="${i}" data-cl-f="date" value="${esc(c.date||"")}">
      <input class="ci" style="flex:1;min-width:170px" data-cl-i="${i}" data-cl-f="label" value="${esc(c.label||"")}" placeholder="假日名称，如 Canada Day（可留空）">
      <button class="delBtn" data-cl-del="${i}">删除</button>
    </div></div>`).join("");
  return `<div class="csub" style="margin-top:6px">营业时间 —— 勾选当天是否营业。营业就填开门 / 关门时间；休息可写原因。</div>
    ${rows}
    <div class="csub" style="margin-top:16px">特殊不营业日期（节假日等）—— 这些日期会在首页日历上<b>标红</b>，并出现在「Upcoming holiday closures」里。</div>
    ${closures || '<p class="csub">还没有特殊休息日，点下面按钮添加。</p>'}
    <button class="addBtn" data-cl-add>＋ 添加休息日 Add closed date</button>`;
}

function doUpload(input, cb){
  const file = input.files && input.files[0]; if(!file){ return; }
  const key = sessionStorage.getItem("fd_admin_key"); if(!key){ alert("请重新登录"); return; }
  $("pageStatus").textContent = "上传图片中…";
  const fd = new FormData(); fd.append("key", key); fd.append("image", file);
  fetch(UPLOAD_API, {method:"POST", body:fd}).then(r=>r.json()).then(j=>{
    if(j && j.ok){ $("pageStatus").textContent="图片已上传 ✓ （记得点「保存并发布」）"; cb(j.url); }
    else { $("pageStatus").textContent=""; alert("上传失败："+((j&&j.error)||"未知错误")); }
  }).catch(()=>{ $("pageStatus").textContent=""; alert("上传失败（网络问题）。"); });
  input.value = "";
}

(function wirePage(){
  const p = $("pagePanel");
  p.addEventListener("input", e=>{
    const el=e.target;
    if(el.hasAttribute("data-tkey")){ TEXT[el.getAttribute("data-tkey")] = el.value; return; }
    if(el.hasAttribute("data-th-i")){ const i=+el.getAttribute("data-th-i"), f=el.getAttribute("data-th-f"); if(THEMES[i]) THEMES[i][f]=el.value; return; }
    if(el.hasAttribute("data-hr-dow")){ const dow=+el.getAttribute("data-hr-dow"), f=el.getAttribute("data-hr-f"); if(f!=="open" && HOURS.weekly[dow]) HOURS.weekly[dow][f]=el.value; return; }
    if(el.hasAttribute("data-cl-i")){ const i=+el.getAttribute("data-cl-i"), f=el.getAttribute("data-cl-f"); if(HOURS.closures[i]) HOURS.closures[i][f]=el.value; return; }
    if(el.hasAttribute("data-field")){ const i=+el.getAttribute("data-i"), f=el.getAttribute("data-field"); if(CONTENT.items[i]) CONTENT.items[i][f]=(el.type==="checkbox")?el.checked:el.value; }
  });
  p.addEventListener("change", e=>{
    const el=e.target;
    if(el.hasAttribute("data-hr-dow") && el.getAttribute("data-hr-f")==="open"){ const dow=+el.getAttribute("data-hr-dow"); if(HOURS.weekly[dow]){ HOURS.weekly[dow].open=el.checked; renderSections(); } return; }
    if(el.hasAttribute("data-field")){ const i=+el.getAttribute("data-i"), f=el.getAttribute("data-field"); if(CONTENT.items[i]) CONTENT.items[i][f]=(el.type==="checkbox")?el.checked:el.value; return; }
    if(el.hasAttribute("data-img-slot")){ const key=el.getAttribute("data-img-slot"); doUpload(el, url=>{ CONTENT.images[key]=url; renderSections(); }); return; }
    if(el.hasAttribute("data-item-img")){ const i=+el.getAttribute("data-item-img"); doUpload(el, url=>{ if(CONTENT.items[i]){ CONTENT.items[i].image=url; renderSections(); } }); return; }
    if(el.hasAttribute("data-th-img")){ const i=+el.getAttribute("data-th-img"); doUpload(el, url=>{ if(THEMES[i]){ THEMES[i].image=url; renderSections(); } }); return; }
  });
  p.addEventListener("click", e=>{
    const el = e.target.closest("[data-sec-toggle],[data-img-reset],[data-item-img-reset],[data-item-del],[data-add-item],[data-th-add],[data-th-del],[data-th-imgreset],[data-cl-add],[data-cl-del]");
    if(!el) return;
    if(el.hasAttribute("data-cl-add")){ HOURS.closures.push({date:"",label:""}); renderSections(); return; }
    if(el.hasAttribute("data-cl-del")){ const i=+el.getAttribute("data-cl-del"); HOURS.closures.splice(i,1); renderSections(); return; }
    if(el.hasAttribute("data-sec-toggle")){ const i=+el.getAttribute("data-sec-toggle"); OPEN[i]=!OPEN[i]; renderSections(); return; }
    if(el.hasAttribute("data-img-reset")){ delete CONTENT.images[el.getAttribute("data-img-reset")]; renderSections(); return; }
    if(el.hasAttribute("data-item-img-reset")){ const i=+el.getAttribute("data-item-img-reset"); if(CONTENT.items[i]){ CONTENT.items[i].image=""; renderSections(); } return; }
    if(el.hasAttribute("data-item-del")){ const i=+el.getAttribute("data-item-del"); if(confirm("删除这一条？")){ CONTENT.items.splice(i,1); renderSections(); } return; }
    if(el.hasAttribute("data-add-item")){ CONTENT.items.push({type:"promo",title:"",body:"",badge:"",date:"",link:"",image:"",active:true}); renderSections(); return; }
    if(el.hasAttribute("data-th-add")){ if(THEMES.length<9){ THEMES.push({emoji:"🎈",title:"新主题 New theme",tag:"",desc:"",image:""}); renderSections(); } return; }
    if(el.hasAttribute("data-th-del")){ const i=+el.getAttribute("data-th-del"); if(THEMES.length>3 && confirm("删除这个主题？")){ THEMES.splice(i,1); renderSections(); } return; }
    if(el.hasAttribute("data-th-imgreset")){ const i=+el.getAttribute("data-th-imgreset"); if(THEMES[i]){ THEMES[i].image=""; renderSections(); } return; }
  });
  $("savePage").addEventListener("click", ()=>{
    const key = sessionStorage.getItem("fd_admin_key"); if(!key){ alert("请重新登录"); return; }
    $("savePage").disabled=true; $("pageStatus").textContent="保存中…";
    const out={}; p.querySelectorAll("[data-tkey]").forEach(el=>{ const k=el.getAttribute("data-tkey"), v=el.value, def=TEXT_DEFAULTS[k]||""; if(v.trim()!=="" && v.trim()!==def.trim()) out[k]=v; });
    const obj={ images:CONTENT.images, items:CONTENT.items, text:out, themes:THEMES, hours:HOURS };
    const fd=new FormData(); fd.append("key",key); fd.append("payload",JSON.stringify(obj));
    fetch(CONTENT_API,{method:"POST",body:fd}).then(r=>r.json()).then(j=>{
      $("savePage").disabled=false;
      if(j&&j.ok){ TEXT=out; $("pageStatus").textContent="已保存并发布 ✓"; }
      else { $("pageStatus").textContent=""; alert("保存失败："+((j&&j.error)||"未知错误")); }
    }).catch(()=>{ $("savePage").disabled=false; $("pageStatus").textContent=""; alert("保存失败（网络问题）。"); });
  });
})();

/* discover each editable string's default text from the live homepage (raw mode, no overrides) */
function discoverDefaults(cb){
  let frame = document.getElementById("rawFrame");
  if(frame) frame.remove();
  frame = document.createElement("iframe");
  frame.id = "rawFrame";
  frame.style.cssText = "position:absolute;left:-9999px;top:-9999px;width:1200px;height:20px;border:0";
  frame.src = "/?raw=1&cb=" + Date.now();
  let done = false;
  const grab = () => {
    if(done) return;
    try{
      const els = frame.contentDocument.querySelectorAll("[data-edit]");
      if(!els.length) return;
      done = true;
      TEXT_DEFAULTS = {}; TEXT_ORDER = [];
      els.forEach(el => { const k = el.getAttribute("data-edit"); if(!(k in TEXT_DEFAULTS)){ TEXT_DEFAULTS[k] = el.textContent.trim().replace(/\s+/g," "); TEXT_ORDER.push(k); } });
      frame.remove(); cb();
    }catch(e){}
  };
  frame.onload = () => { setTimeout(grab,350); setTimeout(grab,1000); setTimeout(grab,2200); };
  document.body.appendChild(frame);
  setTimeout(() => { if(!done){ done=true; cb(); } }, 5000);
}
